<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563EB" />
    <title>Ocean Tic Tac Toe</title>
    <meta name="description" content="Modern, minimalistic Tic Tac Toe game in Ocean Professional theme." />
    <style>
      :root {
        --color-primary: #2563EB;
        --color-secondary: #F59E0B;
        --color-success: #F59E0B;
        --color-error: #EF4444;
        --color-bg: #f9fafb;
        --color-surface: #ffffff;
        --color-text: #111827;
        --ring: 0 0 0 3px rgba(37,99,235,0.25);
        --radius: 14px;
        --radius-sm: 10px;
        --shadow-md: 0 10px 30px rgba(2,6,23,0.08), 0 1px 2px rgba(2,6,23,0.04);
        --shadow-lg: 0 20px 60px rgba(2,6,23,0.10), 0 2px 6px rgba(2,6,23,0.06);
      }
      html, body, #root {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--color-bg);
        color: var(--color-text);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica Neue, Arial, "Apple Color Emoji", "Segoe UI Emoji";
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>
  </head>
  <body>
    <noscript>Enable JavaScript to play Tic Tac Toe.</noscript>
    <div id="root"></div>
  </body>
</html>
